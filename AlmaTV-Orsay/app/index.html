<!doctype html>
<html lang="es">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=1280, user-scalable=no" />
    <meta name="alma-build" content="11.1.2" />
    <title>Alma TV</title>
    <link rel="stylesheet" href="style.css" />
    <script
      type="text/javascript"
      charset="UTF-8"
      src="$MANAGER_WIDGET/Common/API/Widget.js"
    ></script>
    <script type="text/javascript" charset="UTF-8" src="$MANAGER_WIDGET/Common/API/TVKeyValue.js"></script>
    <script type="text/javascript" charset="UTF-8" src="$MANAGER_WIDGET/Common/API/Plugin.js"></script>
    <script
      type="text/javascript"
      charset="UTF-8"
      src="$MANAGER_WIDGET/Common/webapi/1.0/webapis.js"
    ></script>
    <script
      type="text/javascript"
      charset="UTF-8"
      src="assets/media.js"
    ></script>
    <script type="text/javascript" charset="UTF-8" src="native-live.js"></script>
    <script type="text/javascript" charset="UTF-8" src="player.js"></script>
    <script type="text/javascript" charset="UTF-8" src="live-tv.js"></script>
    <script type="text/javascript" charset="UTF-8" src="youtube.js"></script>
    <script type="text/javascript" charset="UTF-8" src="tv-audio.js"></script>
    <script type="text/javascript" charset="UTF-8" src="assets/qrcode.js"></script>
    <script type="text/javascript" charset="UTF-8" src="hub-client.js"></script>
    <script type="text/javascript" charset="UTF-8" src="assets/profile.js"></script>
    <script type="text/javascript" charset="UTF-8" src="main.js"></script>
  </head>
  <body onunload="Alma.destroy()">
    <object id="pluginObjectNNavi" classid="clsid:SAMSUNG-INFOLINK-NNAVI" style="position:absolute;width:0;height:0;visibility:hidden"></object>
    <div id="stage">
      <div id="wallpaper"></div>
      <div id="wallpaper-shade"></div>
      <div id="saver-wallpaper"></div>
      <div id="video-help" style="display: none">Aceptar: reproducir o pausar · ◀ / ▶: 10 segundos · Volver: reducir</div>
      <div id="safe">
        <header id="header">
          <nav id="nav"></nav>
          <div id="status">
            <span id="network">Conexión sin comprobar</span><b id="time"></b><span id="profile-photo" role="img" aria-label="Tu foto de perfil"><span>A</span></span>
          </div>
        </header>
        <main id="view"></main>
        <div id="youtube-host" style="display:none"></div>
        <div id="youtube-audio-host" aria-hidden="true"></div>
        <audio id="media-audio" preload="none"></audio>
        <video
          id="media-video"
          preload="metadata"
          playsinline
          style="display: none"
        ></video>
        <footer id="footer" aria-hidden="true"></footer>
        <div
          id="dialog"
          role="dialog"
          aria-modal="true"
          style="display: none"
        ></div>
        <div id="toast" role="status" style="display: none"></div>
      </div>
    </div>
    <script type="text/javascript">Alma.init();</script>
  </body>
</html>
