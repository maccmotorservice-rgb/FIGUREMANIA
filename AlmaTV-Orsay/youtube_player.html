<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="origin">
<title>Prueba de YouTube - Alma TV</title>
<style>html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;font:16px Arial,sans-serif}#surface,#player,iframe{display:block;width:100%;height:100%;border:0}#direct{display:none;background:#f0f7f4;color:#153f3d;padding:10px;box-sizing:border-box}button{font:inherit;border:0;border-radius:20px;padding:9px 20px;margin:0 8px 5px 0;background:#246250;color:#fff;cursor:pointer}#status{margin:4px 0;line-height:1.4;font-size:14px}</style>
</head>
<body>
<div id="surface"><div id="player"></div></div>
<div id="direct"><button id="direct-play">Reproducir</button><button id="direct-pause">Pausar</button><span>YouTube oficial - prueba directa</span><p id="status" role="status">Conectando con YouTube...</p></div>
<script>
(function () {
  "use strict";
  var config = __ALMA_YT_CONFIG__, player = null, ready = false, watchdog = null, initialTime = null, layoutWidth = 0, layoutHeight = 0, fittedWidth = 0, fittedHeight = 0, seekTimer = null, seekTarget = null, loadRequested=false;
  function details() {
    var state = null, seconds = null, muted = null, volume = null;
    try { if (ready && player && typeof player.getPlayerState === "function") state = player.getPlayerState(); } catch (e) {}
    try { if (ready && player && typeof player.getCurrentTime === "function") seconds = player.getCurrentTime(); } catch (e) {}
    try { if (ready && player && typeof player.isMuted === "function") muted = player.isMuted(); } catch (e) {}
    try { if(ready && player && typeof player.getVolume === "function") volume=player.getVolume(); } catch(e) {}
    var node = document.querySelector("#surface iframe"), box = node && node.getBoundingClientRect();
    var video = document.createElement("video"), h264 = "";
    try { h264 = video.canPlayType('video/mp4; codecs="avc1.42E01E, mp4a.40.2"'); } catch (e) {}
    return { state: state, seconds: seconds, volume:volume, muted: muted, width: box ? Math.round(box.width) : 0, height: box ? Math.round(box.height) : 0, h264: h264, mse: !!(window.MediaSource || window.WebKitMediaSource) };
  }
  function report(phase, status) {
    try {
      var data = details(); data.phase = phase; data.status = status; data.token = config.token; data.source = config.standalone ? "directo" : "alma-tv";
      var xhr = new XMLHttpRequest(); xhr.open("POST", "/youtube/diagnostic", true);
      xhr.setRequestHeader("Content-Type", "application/json"); xhr.timeout = 5000;
      xhr.send(JSON.stringify(data));
    } catch (e) {}
  }
  function tell(type, status, state) {
    var title = "";
    if (ready && player && typeof player.getVideoData === "function") {
      try { title = String(player.getVideoData().title || ""); } catch (e) {}
    }
    document.getElementById("status").textContent = status;
    if (config.standalone) fit();
    if (window.parent !== window) window.parent.postMessage(JSON.stringify({ channel: "alma-youtube", token: config.token, type: type, status: status, state: state, title: title,video:config.video }), config.parent === "null" ? "*" : config.parent);
  }
  function fit() {
    var width = layoutWidth || document.documentElement.clientWidth || window.innerWidth;
    var height = layoutHeight || document.documentElement.clientHeight || window.innerHeight;
    if (config.standalone) height -= document.getElementById("direct").offsetHeight;
    width = Math.max(200, width); height = Math.max(200, height);
    var areaHeight = height;
    width = Math.min(width, height * 16 / 9); height = width * 9 / 16;
    var surface = document.getElementById("surface");
    surface.style.width = width + "px"; surface.style.height = height + "px";
    surface.style.margin = Math.max(0, (areaHeight - height) / 2) + "px auto";
    var iframe = document.querySelector("#surface iframe");
    if (!iframe || (fittedWidth === Math.round(width) && fittedHeight === Math.round(height))) return;
    fittedWidth = Math.round(width); fittedHeight = Math.round(height);
    if (iframe) {
      iframe.width = Math.round(width); iframe.height = Math.round(height);
      iframe.style.width = width + "px"; iframe.style.height = height + "px";
    }
    try { if (ready && player && typeof player.setSize === "function") player.setSize(width, height); } catch (e) {}
  }
  function failure(code) {
    clearTimeout(watchdog);
    var reasons = {
      2: "El enlace no identifica un v\u00eddeo v\u00e1lido.",
      5: "YouTube no puede reproducir este v\u00eddeo en el navegador del televisor.",
      100: "El v\u00eddeo no est\u00e1 disponible o es privado.",
      101: "El propietario no permite reproducir este v\u00eddeo fuera de YouTube.",
      150: "El propietario no permite reproducir este v\u00eddeo fuera de YouTube.",
      153: "YouTube no pudo verificar el origen del reproductor (153)."
    };
    var message = reasons[code] || "YouTube devolvi\u00f3 un error de reproducci\u00f3n (" + code + ").";
    tell("error", message, -1); report("error", message);
  }
  function start() {
    if (!ready || !player) { tell("status", "YouTube todav\u00eda no est\u00e1 listo para recibir la orden.", -1); return; }
    clearTimeout(watchdog);
    fit();
    initialTime = details().seconds;
    tell("command", "Orden Reproducir recibida. Esperando a YouTube\u2026");
    report("command", "Orden Reproducir recibida.");
    watchdog = setTimeout(function () {
      var data = details();
      if (data.state === 1 && typeof data.seconds === "number" && typeof initialTime === "number" && data.seconds > initialTime + 0.25) {
        report("progress", "YouTube informa reproducci\u00f3n y su tiempo avanza.");
        return;
      }
      var message = "YT-INICIO: la orden lleg\u00f3, pero YouTube no inici\u00f3 o no avanz\u00f3. Estado: " + (data.state === null ? "sin datos" : data.state) + ". Tiempo: " + (data.seconds === null ? "sin datos" : Math.round(data.seconds)) + " s. Revisa Estado del reproductor en la Mac.";
      tell("status", message, data.state); report("timeout", message);
    }, 12000);
    try {
      var state = details().state;
      if ((loadRequested || state === -1) && typeof player.loadVideoById === "function") { if(loadRequested)initialTime=0;loadRequested=false;player.loadVideoById(config.video); }
      else player.playVideo();
    } catch (e) { clearTimeout(watchdog); tell("error", "YT-ORDEN: el navegador no pudo iniciar el v\u00eddeo.", -1); report("error", "YT-ORDEN: el navegador no pudo iniciar el v\u00eddeo."); }
  }
  function pause() {
    clearTimeout(watchdog);
    try { if (ready && player) player.pauseVideo(); } catch (e) {}
  }
  function seekBy(delta) {
    if (!ready || !player || typeof player.seekTo !== "function") return;
    var base = seekTarget === null ? player.getCurrentTime() : seekTarget;
    seekTarget = Math.max(0, base + delta);
    if (typeof player.getDuration === "function") {
      var duration = player.getDuration();
      if (typeof duration === "number" && isFinite(duration) && duration > 0) seekTarget = Math.min(duration, seekTarget);
    }
    clearTimeout(seekTimer);
    tell("command", "Salto solicitado: " + (delta > 0 ? "+" : "") + delta + " s.");
    seekTimer = setTimeout(function () {
      var target = seekTarget; seekTarget = null;
      try { if (ready && player) player.seekTo(target, true); }
      catch (e) { tell("status", "YouTube no pudo buscar ese punto del video."); }
    }, 180);
  }
  function command(name, seconds) {
    try {
      if (name === "play") start();
      else if (name === "pause") pause();
      else if (name === "toggle") { if (details().state === 1) pause(); else start(); }
      else if (name === "back" && ready) seekBy(-([5, 10, 30].indexOf(seconds) !== -1 ? seconds : 10));
      else if (name === "forward" && ready) seekBy([5, 10, 30].indexOf(seconds) !== -1 ? seconds : 10);
    } catch (e) { tell("error", "YT-ORDEN: el navegador no pudo enviar el control a YouTube.", -1); report("error", "YT-ORDEN: el navegador no pudo enviar el control a YouTube."); }
  }
  window.onYouTubeIframeAPIReady = function () {
    try {
      player = new YT.Player("player", {
        width: "100%", height: "100%", videoId: config.video,
        playerVars: { controls: 1, autoplay: 0, playsinline: 1, fs: 1, origin: window.location.protocol + "//" + window.location.host },
        events: {
          onReady: function () { ready = true; fittedWidth = 0; fittedHeight = 0; fit(); tell("ready", "YouTube est\u00e1 listo (API). Pulsa Reproducir.", details().state); report("ready", "La API est\u00e1 lista; a\u00fan no se ha confirmado reproducci\u00f3n."); },
          onStateChange: function (e) {
            var labels = { "-1": "V\u00eddeo sin iniciar. Pulsa Reproducir.", 0: "Finalizado", 1: "Reproduciendo en YouTube", 2: "En pausa", 3: "Cargando v\u00eddeo de YouTube\u2026", 5: "V\u00eddeo preparado" };
            tell("state", labels[e.data] || "YouTube", e.data);
            if (e.data === 0 || e.data === 2) clearTimeout(watchdog);
            report("state", labels[e.data] || "YouTube");
          },
          onError: function (e) { failure(e.data); },
          onAutoplayBlocked: function () { clearTimeout(watchdog); var text = "YT-ACTIVACION: YouTube bloque\u00f3 el inicio autom\u00e1tico y requiere una interacci\u00f3n directa con su reproductor."; tell("status", text, -1); report("blocked", text); }
        }
      });
    } catch (e) { tell("error", "El navegador no pudo iniciar el reproductor oficial de YouTube.", -1); report("error", "El navegador no pudo iniciar el reproductor oficial de YouTube."); }
  };
  window.addEventListener("message", function (event) {
    var data;
    try { data = typeof event.data === "string" ? JSON.parse(event.data) : event.data; } catch (e) { return; }
    if (!data || data.channel !== "alma-youtube" || data.token !== config.token) return;
    if (event.source !== window.parent) { report("rejected", "YT-FUENTE: la orden no procede de la ventana que contiene el reproductor."); return; }
    var fileOrigin = config.parent === "null" && (event.origin === "file://" || event.origin === "file:///" || event.origin === "");
    if (event.origin !== config.parent && !fileOrigin) {
      var text = "YT-ORIGEN: el control lleg\u00f3 con un origen distinto del esperado. La orden no se ejecut\u00f3.";
      tell("status", text); report("rejected", text); return;
    }
    if (data.command === "presentation") {
      if (typeof data.visible !== "boolean") return;
      var surface = document.getElementById("surface");
      // Move the native video surface outside the viewport; keep its session and audio.
      surface.style.display = !data.visible && data.remove !== false ? "none" : "block";
      var embedded = surface.querySelector("iframe");
      if (embedded) embedded.style.display = !data.visible && data.remove !== false ? "none" : "block";
      surface.style.position = data.visible ? "relative" : "absolute";
      surface.style.left = data.visible ? "0px" : "-10000px";
      surface.style.top = data.visible ? "0px" : "-10000px";
      surface.style.visibility = data.visible ? "visible" : "hidden";
      surface.style.clip = data.visible ? "auto" : "rect(0px,0px,0px,0px)";
      return;
    }
    if (data.command === "volume") {
      if (!ready || !player || typeof data.level !== "number" || !isFinite(data.level) || data.level<0 || data.level>100 || typeof data.muted!=="boolean") return;
      try {
        if(typeof player.setVolume!=="function") throw new Error("No volume API");
        player.setVolume(data.level);
        if(data.muted) { if(typeof player.mute!=="function") throw new Error("No mute API"); player.mute(); }
        else if(typeof player.unMute==="function") player.unMute();
      } catch(e) { tell("status","El reproductor no permite ajustar su audio desde la app."); }
      return;
    }
    if (data.command === "resize") {
      if (typeof data.width !== "number" || typeof data.height !== "number" || !isFinite(data.width) || !isFinite(data.height) || data.width < 200 || data.height < 200 || data.width > 4096 || data.height > 2160) return;
      layoutWidth = data.width; layoutHeight = data.height; fit();
      return;
    }
    if(data.command==="load"){
      if(!ready || typeof data.video!=="string" || !/^[A-Za-z0-9_-]{11}$/.test(data.video))return;
      config.video=data.video;loadRequested=true;command("play");return;
    }
    command(data.command, data.seconds);
  }, false);
  if (config.standalone) {
    document.getElementById("direct").style.display = "block";
    document.getElementById("direct-play").onclick = start;
    document.getElementById("direct-pause").onclick = pause;
    document.addEventListener("keydown", function (event) {
      var code = event.keyCode || event.which;
      if (code === 13 || code === 29443 || code === 32) { command("toggle"); if (event.preventDefault) event.preventDefault(); }
    }, false);
  }
  window.addEventListener("resize", fit, false);
  fit();
  setInterval(function(){
    if(!ready||window.parent===window)return;
    var data=details(),duration=0;
    try{duration=Number(player.getDuration())||0;}catch(ignore){}
    window.parent.postMessage(JSON.stringify({channel:"alma-youtube",token:config.token,type:"progress",video:config.video,state:data.state,seconds:data.seconds,duration:duration,volume:data.volume,muted:data.muted}),config.parent==="null"?"*":config.parent);
  },2000);
  var script = document.createElement("script");
  script.src = "https://www.youtube.com/iframe_api";
  script.onerror = function () { tell("error", "No se pudo cargar YouTube. Comprueba internet y la compatibilidad HTTPS del televisor.", -1); report("error", "No se pudo cargar la API de YouTube."); };
  document.head.appendChild(script);
})();
</script>
</body>
</html>
